name: Release Obsidian Plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 0 indicates all history for tags

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          assets=("main.js" "manifest.json")
          if [ -f "styles.css" ]; then
            assets+=("styles.css")
          fi

          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            --draft \
            "${assets[@]}"
